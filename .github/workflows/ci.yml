name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node 22 matches the Dockerfile's build stage.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      # Also runs tools/postbuild.mjs (CSP, sitemap, robots) through npm's postbuild hook.
      - run: npm run build
