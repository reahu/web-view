# Serves the statically prerendered Angular site (dist/web-view/browser).
# Every route exists as <path>/index.html, so there is no SPA fallback: unknown URLs get
# the prerendered 404 page with a real 404 status.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative to the request's host and scheme (works behind a proxy).
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

  # Applies to responses from locations without their own add_header (redirects, errors).
  include security-headers.conf;

  error_page 404 /404/index.html;

  # The prerendered 404 page is only served as an error page, never as /404.
  location = /404/index.html {
    internal;
    # `always`: without it add_header skips 4xx responses, and this page is only served as a 404.
    add_header Cache-Control "no-cache" always;
    include security-headers.conf;
  }

  location ~ ^/404/?$ {
    return 404;
  }

  # The client-side shell is a build artefact; no page links to it.
  location = /index.csr.html {
    return 404;
  }

  # Legacy URL from the old site. The prerendered redirect route (social/index.html) is
  # never served.
  location ~ ^/social(?:/|/index\.html)?$ {
    return 301 /latest-news;
  }

  # Hashed build output never changes under the same name. Fonts in public/fonts are not
  # hashed: replacing one means giving it a new filename.
  location ~* \.(?:js|css|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include security-headers.conf;
  }

  # Pages: /csr and /csr/ both serve csr/index.html directly (no trailing-slash redirect).
  # HTML is revalidated so a deploy is picked up immediately.
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
    include security-headers.conf;
  }
}
