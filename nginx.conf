# Serves the statically prerendered Angular site (dist/web-view/browser).
# Every route exists as <path>/index.html, so there is no SPA fallback: unknown URLs get
# the prerendered 404 page with a real 404 status.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative to the request's host and scheme (works behind a proxy).
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  error_page 404 /404/index.html;

  # The prerendered 404 page is only served as an error page, never as /404.
  location = /404/index.html {
    internal;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Legacy URL from the old site.
  location = /social {
    return 301 /latest-news;
  }

  # Hashed build output and self-hosted fonts never change under the same name.
  location ~* \.(?:js|css|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Pages: /csr and /csr/ both serve csr/index.html directly (no trailing-slash redirect).
  # HTML is revalidated so a deploy is picked up immediately.
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
