# Security headers for every response. Included at server level and again in each location
# that sets its own add_header, because add_header in a location replaces the inherited set.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The main Content-Security-Policy is a <meta> in each page, holding that page's inline-script
# hashes (tools/postbuild.mjs). frame-ancestors only works as a header, so it lives here; both
# policies apply. X-Frame-Options covers browsers without frame-ancestors.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

# Only the YouTube player (rg-video-facade) gets media features. Its iframe also asks for
# accelerometer and gyroscope (used for 360° video); they're denied here on purpose.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), autoplay=(self \"https://www.youtube-nocookie.com\"), encrypted-media=(self \"https://www.youtube-nocookie.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\"), picture-in-picture=(self \"https://www.youtube-nocookie.com\")" always;
