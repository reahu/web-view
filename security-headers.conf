# Security headers for every response. Included at server level and again in each location
# that sets its own add_header, because add_header in a location replaces the inherited set.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The main Content-Security-Policy is a <meta> in each page, holding that page's inline-script
# hashes (tools/postbuild.mjs). frame-ancestors only works as a header, so it lives here; both
# policies apply. X-Frame-Options covers browsers without frame-ancestors.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

# autoplay: the silent video loops start by themselves (VideoLoop), which autoplay=() blocks
# even when muted. The site uses none of the others; embeds would need their own grants here.
add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=()" always;
