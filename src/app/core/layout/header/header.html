<header class="header">
  <div class="container header__bar">
    <a class="brand" [routerLink]="'/' | langPath">
      <img
        [ngSrc]="logo.src"
        [width]="logo.width"
        [height]="logo.height"
        [alt]="'layout.logoAlt' | translate"
      />
      <!-- The logo's alt already names the company, so screen readers skip the repeat. -->
      <span class="brand__name" aria-hidden="true">{{ 'site.name' | translate }}</span>
    </a>

    <!--
      DOM order = visual order at every width: nav (inline when wide), language, menu.
      The language switch stays outside the drawer so it's one tap away on phones.
    -->
    <rg-mobile-drawer
      id="site-nav"
      [label]="'layout.siteMenu' | translate"
      [(open)]="navOpen"
      (dismissed)="menuToggle.focus()"
    >
      <rg-nav-menu />
    </rg-mobile-drawer>

    <rg-language-switch />

    <button
      #menuToggle
      type="button"
      class="header__button header__toggle"
      aria-controls="site-nav"
      [attr.aria-expanded]="navOpen()"
      (click)="navOpen.set(!navOpen())"
    >
      <svg viewBox="0 0 18 14" width="18" height="14" aria-hidden="true">
        <path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="1.5" />
      </svg>
      <span>{{ 'layout.menu' | translate }}</span>
    </button>
  </div>
</header>
