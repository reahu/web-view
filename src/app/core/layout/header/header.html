<header class="header">
  <div class="container header__bar">
    <a class="brand" routerLink="/">
      Royal Group<span class="visually-hidden"> of Cambodia, home page</span>
    </a>

    <!-- DOM order = visual order at every width: nav (inline when wide), search, menu. -->
    <rg-mobile-drawer
      id="site-nav"
      label="Site menu"
      [(open)]="navOpen"
      (dismissed)="menuToggle.focus()"
    >
      <rg-nav-menu />
    </rg-mobile-drawer>

    <button #searchButton type="button" class="header__button" (click)="search.open()">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M11 11l4 4" stroke="currentColor" stroke-width="1.5" />
      </svg>
      <span class="header__button-label">Search</span>
    </button>

    <button
      #menuToggle
      type="button"
      class="header__button header__toggle"
      aria-controls="site-nav"
      [attr.aria-expanded]="navOpen()"
      (click)="navOpen.set(!navOpen())"
    >
      <svg viewBox="0 0 18 14" width="18" height="14" aria-hidden="true">
        <path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="1.5" />
      </svg>
      Menu
    </button>
  </div>
</header>

<rg-search-overlay #search (closed)="searchButton.focus()" />
