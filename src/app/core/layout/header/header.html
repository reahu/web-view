<header class="header">
  <div class="container header__bar">
    <a class="brand" routerLink="/">
      <img
        [ngSrc]="logo.src"
        [width]="logo.width"
        [height]="logo.height"
        alt="Malin Koh Kong Peace Development, home page"
        i18n-alt="@@layout.logoAlt"
      />
    </a>

    <!-- DOM order = visual order at every width: nav (inline when wide), then menu. -->
    <rg-mobile-drawer
      id="site-nav"
      label="Site menu"
      i18n-label="@@layout.siteMenu"
      [(open)]="navOpen"
      (dismissed)="menuToggle.focus()"
    >
      <rg-nav-menu />
    </rg-mobile-drawer>

    <button
      #menuToggle
      type="button"
      class="header__button header__toggle"
      aria-controls="site-nav"
      [attr.aria-expanded]="navOpen()"
      (click)="navOpen.set(!navOpen())"
    >
      <svg viewBox="0 0 18 14" width="18" height="14" aria-hidden="true">
        <path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="1.5" />
      </svg>
      <span i18n="@@layout.menu">Menu</span>
    </button>
  </div>
</header>
