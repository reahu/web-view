@for (link of links(); track link.language.code) {
  <a
    class="switch"
    [href]="link.href"
    [attr.hreflang]="link.language.code"
    [attr.lang]="link.language.code"
  >
    @switch (link.language.code) {
      @case ('km') {
        <!-- Cambodia (25:16), Angkor Wat reduced to its outline -->
        <svg class="flag" viewBox="0 0 100 64" width="25" height="16" aria-hidden="true">
          <path fill="#032ea1" d="M0 0h100v64H0z" />
          <path fill="#e00025" d="M0 16h100v32H0z" />
          <path
            fill="#fff"
            d="M29.3 45.3V43h1.2v-2h1v-2h1v-2h1v-8h2c0-3 1.8-4.5 2.7-5.8.9 1.3 2.7 2.8 2.7 5.8h1v1h4v-3h.6c0-3.5 2.3-6.5 3.5-8.3 1.2 1.8 3.5 4.8 3.5 8.3h.6v3h4v-1h1c0-3 1.8-4.5 2.7-5.8.9 1.3 2.7 2.8 2.7 5.8h2v8h1v2h1v2h1v2h1.2v2.3z"
          />
        </svg>
      }
      @case ('en') {
        <!-- United Kingdom (2:1), as the English copy is British. The red diagonals are offset, as on the real flag. -->
        <svg class="flag" viewBox="0 0 60 30" width="30" height="15" aria-hidden="true">
          <path fill="#012169" d="M0 0h60v30H0z" />
          <path stroke="#fff" stroke-width="6" d="M0 0l60 30M60 0L0 30" />
          <path
            fill="#c8102e"
            d="M0 0l30 15h-4.47L0 2.24zm60 30L30 15h4.47L60 27.76zM60 0L30 15v-2.24L55.53 0zM0 30l30-15v2.24L4.47 30z"
          />
          <path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60" />
          <path stroke="#c8102e" stroke-width="6" d="M30 0v30M0 15h60" />
        </svg>
      }
      @default never;
    }
    <span class="visually-hidden">{{ link.language.label }}</span>
  </a>
}
