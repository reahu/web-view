<details #menu class="switch">
  <summary class="switch__button">
    <svg class="switch__globe" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.25">
        <circle cx="8" cy="8" r="6.5" />
        <path
          d="M1.5 8h13M8 1.5c-1.9 1.9-2.8 4.1-2.8 6.5s.9 4.6 2.8 6.5M8 1.5c1.9 1.9 2.8 4.1 2.8 6.5s-.9 4.6-2.8 6.5"
        />
      </g>
    </svg>
    <!-- Read as "Language English"; the short form alone would be read as a word ("en"). -->
    <span class="visually-hidden">{{ 'layout.language' | translate }} {{ current().label }}</span>
    <span aria-hidden="true">{{ current().short }}</span>
    <svg class="switch__chevron" viewBox="0 0 12 8" width="12" height="8" aria-hidden="true">
      <path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" />
    </svg>
  </summary>

  <ul class="switch__menu" role="list">
    @for (link of links(); track link.language.code) {
      <li>
        @if (link.language === current()) {
          <span
            class="switch__item is-current"
            aria-current="true"
            [attr.lang]="link.language.code"
          >
            {{ link.language.label }}
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.75" />
            </svg>
          </span>
        } @else {
          <a
            class="switch__item"
            [routerLink]="link.url"
            [attr.hreflang]="link.language.code"
            [attr.lang]="link.language.code"
            >{{ link.language.label }}</a
          >
        }
      </li>
    }
  </ul>
</details>
