<dialog #dialog class="dialog" aria-labelledby="search-title" (close)="onClose()">
  <div class="panel">
    <div class="bar">
      <label id="search-title" for="site-search" class="label">Search the site</label>
      <button type="button" class="close" (click)="close()">
        Close
        <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </div>
    <input
      id="site-search"
      class="input"
      type="search"
      autocomplete="off"
      spellcheck="false"
      aria-describedby="search-status"
      [formField]="searchForm.query"
    />
    <p id="search-status" class="status" role="status">{{ isOpen() ? status() : '' }}</p>

    @if (results().length) {
      <ul class="results" role="list">
        @for (result of results(); track result.kind + result.url) {
          <li class="result">
            <span class="kind">{{ result.kind }}</span>
            @if (result.external) {
              <rg-external-link [href]="result.url">{{ result.title }}</rg-external-link>
            } @else {
              <a [routerLink]="result.url">{{ result.title }}</a>
            }
            @if (result.summary) {
              <p class="summary">{{ result.summary }}</p>
            }
          </li>
        }
      </ul>
    }
  </div>
</dialog>
