<div class="container page">
  <header class="page-header">
    <h1>Latest news</h1>
    <p class="lead">News and announcements from Royal Group and its companies.</p>
  </header>

  <ul class="grid" role="list">
    @for (item of news(); track item.id) {
      <li><rg-news-card [item]="item" [headingLevel]="2" /></li>
    } @empty {
      <li>There is no news to show yet.</li>
    }
  </ul>
</div>
