<section class="hero" aria-labelledby="home-title">
  <div class="container hero__inner">
    <div class="hero__text">
      <h1 id="home-title">{{ 'home.welcome.heading' | translate }}</h1>
      <p class="hero__lead">{{ 'company.experience' | translate }}</p>
      <p class="hero__values">{{ 'company.values' | translate }}</p>
      <div class="hero__actions">
        <a class="button button--on-dark" [routerLink]="'/services' | langPath">{{
          'home.hero.services' | translate
        }}</a>
        <a class="button hero__secondary" [routerLink]="'/contact-us' | langPath">{{
          'nav.contact' | translate
        }}</a>
      </div>
    </div>
    <img
      class="hero__image"
      ngSrc="/images/photos/hall.webp"
      width="1280"
      height="960"
      priority
      [alt]="'home.hero.imageAlt' | translate"
    />
  </div>
</section>

<section class="section section--mist" aria-labelledby="process-title">
  <div class="container">
    <rg-section-heading
      headingId="process-title"
      [heading]="'process.heading' | translate"
      [linkLabel]="'home.hero.services' | translate"
      linkPath="/services"
    />
    <rg-process-steps [steps]="steps()" [showText]="false" />
  </div>
</section>

<rg-quote-cta />
