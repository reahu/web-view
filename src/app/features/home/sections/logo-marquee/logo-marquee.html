<section class="section section--mist" aria-labelledby="logo-marquee-heading">
  <div class="container">
    <rg-section-heading
      heading="Our companies"
      headingId="logo-marquee-heading"
      linkLabel="View business portfolio"
      linkPath="/business-portfolio"
    />
    <button
      type="button"
      class="button button--secondary toggle"
      (click)="stopped.set(!stopped())"
    >
      {{ stopped() ? 'Start scrolling' : 'Stop scrolling' }}
    </button>
  </div>

  <div class="viewport" [class.is-stopped]="stopped()">
    <ul class="track" role="list" [style.--count]="companies().length">
      @for (company of companies(); track company.slug; let i = $index) {
        <li class="logo" [style.--i]="i">
          <a [routerLink]="['/business-portfolio', company.slug]">
            <img [ngSrc]="company.logo" [alt]="company.logoAlt" width="160" height="80" />
          </a>
        </li>
      }
    </ul>
  </div>
</section>
