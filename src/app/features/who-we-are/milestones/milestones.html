<div class="container page">
  <header class="page-header">
    <h1>Milestones</h1>
    <p class="lead">Placeholder copy. Key moments in the growth of Royal Group, year by year.</p>
  </header>

  <ol class="timeline" role="list">
    @for (milestone of milestones(); track milestone.year + milestone.title) {
      <li class="entry">
        <p class="year">{{ milestone.year }}</p>
        <div class="body">
          <h2 class="title">{{ milestone.title }}</h2>
          <p>{{ milestone.text }}</p>
        </div>
      </li>
    }
  </ol>
</div>
