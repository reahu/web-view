<section class="cta" aria-labelledby="quote-cta-title">
  <div class="container cta__inner">
    <div>
      <h2 id="quote-cta-title" i18n="@@cta.heading">Need sand for your project?</h2>
      <p class="cta__body" i18n="@@cta.body">
        Tell us what you need and where, and we’ll get back to you.
      </p>
    </div>
    <a
      class="button button--on-dark"
      routerLink="/contact-us"
      [queryParams]="{ topic: 'quote' }"
      i18n="@@cta.button"
      >Request a quote</a
    >
  </div>
</section>
