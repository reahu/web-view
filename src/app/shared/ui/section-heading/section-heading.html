<div class="row">
  @if (level() === 3) {
    <h3 [attr.id]="headingId() ?? null">{{ heading() }}</h3>
  } @else {
    <h2 [attr.id]="headingId() ?? null">{{ heading() }}</h2>
  }
  @if (linkLabel() && linkPath(); as path) {
    <a class="link" [routerLink]="path | langPath">{{ linkLabel() }}</a>
  }
</div>
@if (intro()) {
  <p class="lead">{{ intro() }}</p>
}
