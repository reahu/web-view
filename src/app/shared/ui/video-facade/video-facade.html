<div class="frame">
  @if (playing() && embedUrl(); as url) {
    <iframe
      [src]="url"
      [title]="title()"
      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  } @else {
    <img [ngSrc]="poster()" alt="" fill sizes="(min-width: 60rem) 50vw, 100vw" />
    <button type="button" class="play" [disabled]="!embedUrl()" (click)="playing.set(true)">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M8 5v14l11-7z" fill="currentColor" />
      </svg>
      <span>Play video<span class="visually-hidden">: {{ title() }}</span></span>
    </button>
  }
</div>
